[project]
name = "hermes-judge-audit"
version = "0.1.0"
description = "Reliability audit of the Hermes Agent /goal completion judge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "hermes-agent",
  "numpy>=2.1",
  "openai>=1.99",
  "pydantic>=2.11",
  "python-dotenv>=1.2.4",
  "scipy>=1.14",
  "tenacity>=9.1.4",
]

[project.optional-dependencies]
harness = ["harbor==0.23.0"]
nel = ["nemo-evaluator==0.3.0"]

[project.scripts]
hjr = "hjr.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12", "scikit-learn>=1.7"]

[tool.uv.sources]
# Git submodule pinned to the audited commit (ffc74885). Hermes only supports editable installs.
hermes-agent = { path = "third_party/hermes-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hjr"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Seed workspaces are task fixtures (some deliberately buggy, some hashed by their checks).
extend-exclude = ["third_party", "tasks/*/environment"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Judge prompt text: one paragraph per line, sent to the model as written.
"hjr/repair.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real model API (deselected by default)"]
addopts = "-m 'not live'"
