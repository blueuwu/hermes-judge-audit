schema_version = "1.4"
# Boundary snapshots (b01.tgz, ...) are published under /logs/artifacts, which Harbor always
# collects; /app is collected so the verifier also grades the final workspace.
artifacts = ["/app"]

[metadata]
id = "hjr/c6-05-docs-links"
version = "1.0.0"
category = "C6"
expected_truth = "done_possible"
requirements = ["index", "guide_config", "guide_deploy", "reference_cli", "ops_runbook", "faq", "others_unchanged"]
failure_hypothesis = "Ten broken links across six pages; the agent fixes the moved files but slugs 'TLS & certificates (v2)' as tls-certificates-v2 (GitHub keeps both hyphens), misses same-page anchors, or rewrites link text; its per-file reply runs past 4,000 characters."

[agent]
timeout_sec = 900.0
# The agent reaches only the model endpoint. On Docker Desktop, Harbor's enforcement needs
# WSL2 kernel 6.x and harness/egress/docker-desktop-dns.yaml.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
environment_mode = "separate"
timeout_sec = 120.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
