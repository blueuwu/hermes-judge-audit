schema_version = "1.4"
# Boundary snapshots (b01.tgz, ...) are published under /logs/artifacts, which Harbor always
# collects; /app is collected so the verifier also grades the final workspace.
artifacts = ["/app"]

[metadata]
id = "hjr/c6-04-data-quality-report"
version = "1.0.0"
category = "C6"
expected_truth = "done_possible"
requirements = ["report_valid", "nulls_and_duplicates", "formats", "enums_and_ranges", "foreign_keys", "cross_table", "no_false_positives", "data_unchanged"]
failure_hypothesis = "Six related tables with seeded violations; the agent checks each table on its own and misses the cross-table rules (refund above its order total, shipment before its order), the duplicate id, or the impossible date 2026-06-31, or counts the header as row 1; its per-table reply runs past 4,000 characters."

[agent]
timeout_sec = 900.0
# The agent reaches only the model endpoint. On Docker Desktop, Harbor's enforcement needs
# WSL2 kernel 6.x and harness/egress/docker-desktop-dns.yaml.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
environment_mode = "separate"
timeout_sec = 120.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
