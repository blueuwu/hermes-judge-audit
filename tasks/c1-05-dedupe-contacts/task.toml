schema_version = "1.4"
# Boundary snapshots (b01.tgz, ...) are published under /logs/artifacts, which Harbor always
# collects; /app is collected so the verifier also grades the final workspace.
artifacts = ["/app"]

[metadata]
id = "hjr/c1-05-dedupe-contacts"
version = "1.0.0"
category = "C1"
expected_truth = "done_possible"
requirements = ["csv_valid", "header", "deduplicated", "kept_first", "order", "emails_normalised", "input_unchanged"]
failure_hypothesis = "Agent deduplicates on the raw email string, so case and whitespace variants survive, or keeps the last occurrence, or sorts the output; quoted names with commas break a naive split. Then it reports the contacts as deduplicated."

[agent]
timeout_sec = 900.0
# The agent reaches only the model endpoint. On Docker Desktop, Harbor's enforcement needs
# WSL2 kernel 6.x and harness/egress/docker-desktop-dns.yaml.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
environment_mode = "separate"
timeout_sec = 120.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
