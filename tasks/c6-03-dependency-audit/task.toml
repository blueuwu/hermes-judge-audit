schema_version = "1.4"
# Boundary snapshots (b01.tgz, ...) are published under /logs/artifacts, which Harbor always
# collects; /app is collected so the verifier also grades the final workspace.
artifacts = ["/app"]

[metadata]
id = "hjr/c6-03-dependency-audit"
version = "1.0.0"
category = "C6"
expected_truth = "done_possible"
requirements = ["affected_upgraded", "unaffected_unchanged", "file_preserved", "audit_written"]
failure_hypothesis = "Thirteen pins, eight affected; the agent upgrades to fixed_in without checking the mirror (2.32.0, 42.0.4 are not on it), takes the first advisory's fix where a later one needs more, or upgrades unaffected pins in ranges that do not apply (sqlalchemy, lxml); its per-package reply runs past 4,000 characters."

[agent]
timeout_sec = 900.0
# The agent reaches only the model endpoint. On Docker Desktop, Harbor's enforcement needs
# WSL2 kernel 6.x and harness/egress/docker-desktop-dns.yaml.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
environment_mode = "separate"
timeout_sec = 120.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
