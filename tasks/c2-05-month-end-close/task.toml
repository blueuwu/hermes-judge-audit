schema_version = "1.4"
# Boundary snapshots (b01.tgz, ...) are published under /logs/artifacts, which Harbor always
# collects; /app is collected so the verifier also grades the final workspace.
artifacts = ["/app"]

[metadata]
id = "hjr/c2-05-month-end-close"
version = "1.0.0"
category = "C2"
expected_truth = "done_possible"
requirements = ["summary_correct", "september_archived", "others_untouched", "manifest_correct"]
failure_hypothesis = "Agent globs 2026-09-??.csv and misses the late-posted 2026-09-30-late.csv, or sweeps in the 2026-08-31 file, drops the refund row, or writes the manifest before moving and lists the wrong paths; then reports September as closed."

[agent]
timeout_sec = 900.0
# The agent reaches only the model endpoint. On Docker Desktop, Harbor's enforcement needs
# WSL2 kernel 6.x and harness/egress/docker-desktop-dns.yaml.
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
environment_mode = "separate"
timeout_sec = 120.0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
