; Service settings, schema v1.
[server]
host = 0.0.0.0
port = 8443
timeout = 30
tls = yes
legacy_mode = no

[database]
url = postgres://app@db.internal:5432/app
pool_size = 12
timeout = 5
read_only = no

[cache]
backend = redis
ttl = 300
timeout = 0.5
compress = yes
legacy_keys = yes

[features]
beta_search = yes
dark_mode = no
