# Judge arms for offline replay.
#
# An arm is (model id, endpoint, provider, sampling). hjr/arms.py hashes those fields into the
# arm_id stored on every record; analysis refuses to pool records from different arms.
#
# Every evaluation arm is pinned to one OpenRouter provider with fallbacks disabled, so pilot,
# main and drift runs share one serving stack. Endpoints marked dev_only (free tiers) are for
# development and can never be pooled with evaluation results.

# Decoding parameters production sends for the goal_judge task at ffc74885
# (hermes_cli/goals.py: temperature=0 at :885, max_tokens default 4096 at :37, no reasoning
# config unless auxiliary.goal_judge sets one). tests/test_arms.py checks these against the
# pinned code. Every judge arm, including `self`, uses them, because production does.
[judge_sampling]
temperature = 0.0
max_tokens = 4096
reasoning = "provider-default"

[endpoints.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
rpm = 120

# The Codex CLI (`codex exec`), on the project owner's subscription: no per-call billing. Used
# only for the `strong` judge (prereg amendment "Phase 2 design"). Each call runs from a fresh
# empty directory, read-only, with tools disabled and user config ignored (hjr/codex.py). The
# CLI version is pinned; a call on any other version is refused.
[endpoints.codex-cli]
kind = "codex"
base_url = "codex-cli://exec"
version = "0.159.3"
rpm = 6
max_concurrent = 12

[endpoints.aistudio-free]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
rpm = 10
dev_only = true

# Agent arms. A `self` judge takes its model and provider from one of these. The two arms come
# from different vendors on different providers, and each passes its own soak gate.
# Weak arm: GLM-5.3-Flash on Z.AI's own endpoint, after Qwen3-Coder failed soak-weak-2 and
# soak-weak-3 (prereg amendment "Weak-arm model"). fp8 is the vendor's serving precision.
[agents.weak]
id = "z-ai/glm-5.3-flash"
endpoint = "openrouter"
provider = "z-ai"

# Strong arm: supplies the genuine DONE boundaries false-CONTINUE needs. Pinned to DeepSeek's
# own endpoint rather than a third-party host with undisclosed quantization.
[agents.strong]
id = "deepseek/deepseek-v4.1-flash"
endpoint = "openrouter"
provider = "deepseek"

[models.flash]
id = "google/gemini-3-flash-preview"
endpoint = "openrouter"
provider = "google-ai-studio"
source = "Recommended goal_judge override in website/docs/user-guide/features/goals.md:244 at ffc74885"

[models.drift]
id = "google/gemini-3.8-flash"
endpoint = "openrouter"
provider = "google-ai-studio"
source = "Drift cell: successor of the goals.md:244 model, same route, compared on frozen items"
# The route serves at most 20 successful requests a minute (pilot-v1 attempts.jsonl: a flat
# 19-22/min under sustained 429s). Judge replay stays below that; agent runs are unaffected.
rpm = 18

# Independent strong judge: a frontier model from a vendor other than both agent arms and the
# flash judge. Served through the Codex CLI, so temperature and max_tokens cannot be set and the
# CLI adds its own instructions around the judge prompt; reasoning effort is pinned. Labelled
# "GPT-6.1 Sol via Codex CLI; harness prompt and sampling params not controllable".
[models.strong]
id = "gpt-6.1-sol"
endpoint = "codex-cli"
provider = "openai-codex"
temperature = "unset"
max_tokens = "unset"
reasoning = "medium"
sampling_note = "Codex CLI exposes no temperature or max_tokens; reasoning effort pinned to medium on both strong arms"
source = "Independent strong judge, prereg amendment 2026-10-02 (Phase 2 design)"

# The same model on the paid API, for the harness sanity check only (20 preregistered
# boundaries, configs/phase2.toml). The model rejects temperature on every listed route, so none
# is sent; no max_tokens, to match the CLI; same reasoning effort.
[models.strong-api]
id = "openai/gpt-6.1-sol"
endpoint = "openrouter"
provider = "openai"
temperature = "unset"
max_tokens = "unset"
reasoning = "medium"
sampling_note = "Matched to the Codex arm: no temperature (rejected by the model), no max_tokens, reasoning effort medium"
source = "Harness sanity check for `strong`, prereg amendment 2026-10-02 (Phase 2 design)"

[models.self-weak]
self_of = "weak"
source = "Production default: goal_judge resolves to the main model (goals.md:238 at ffc74885)"

[models.self-strong]
self_of = "strong"
source = "Production default: goal_judge resolves to the main model (goals.md:238 at ffc74885)"

[models.flash-dev]
id = "gemini-3-flash-preview"
endpoint = "aistudio-free"
source = "Development only: free-tier AI Studio, never pooled with evaluation results"
