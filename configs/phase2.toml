# Phase 2 judge replay plan, frozen by the prereg amendment of 2026-10-02 ("Phase 2 design")
# before any truth label or Phase-2 judge call exists. Read by hjr/phase2.py. The label-order
# and relabel streams and the label settings were retired by Amendment 1 (2026-10-03).

samples = 3

# Each agent arm's frozen Phase-1 boundaries and the run that replays them. Arms are never
# pooled; every number is reported per arm.
[arms.weak]
boundaries = "data/frozen/phase1-weak.jsonl"
run_id = "phase2-weak"

[arms.strong]
boundaries = "data/frozen/phase1-strong.jsonl"
run_id = "phase2-strong"

[cells]
# prompt:model:view. `self` is the arm's own self judge: self-weak on weak boundaries,
# self-strong on strong ones.
run = [
    "prod-plain:self:head4k",
    "prod-plain:flash:head4k",
    "prod-plain:strong:head4k",
    "prod-plain:flash:evidence",
    "repair-v1:flash:evidence",
    "repair-v1:strong:evidence",
]
# Not called: no Phase-1 response exceeds 4,000 characters, so on every Phase-1 boundary this
# cell sends byte-identical prompts to the one named (checked by tests/test_phase2.py).
identical = { "prod-plain:flash:headtail4k" = "prod-plain:flash:head4k" }

# Named streams under the global seed (configs/seeds.toml); each draws from
# random.Random("<global>:<stream>").
[seeds]
sanity = "harness-sanity"
bootstrap = "bootstrap"

# Harness sanity check for the strong judge: the same prompts through the paid API
# (`strong-api`), 3 samples each, compared with the Codex CLI arm on the same boundaries. Runs
# are `<run_id>-<arm>`; the drawn ids are listed below and regenerated by tests/test_phase2.py.
# Per arm, `not_done` boundaries are drawn from verifier truth != done and the rest from
# verifier truth == done, each pool sorted by id and sampled with the `sanity` stream.
[sanity]
per_arm = 10
not_done = 5
samples = 3
variants = ["prod-plain:strong-api:head4k", "repair-v1:strong-api:evidence"]
run_id = "phase2-sanity"

[sanity.ids]
strong = [
    "phase1-strong/c1-03-rename-config-key__YwgbgmR/b01",
    "phase1-strong/c1-04-fix-slugify__zmYLsTq/b01",
